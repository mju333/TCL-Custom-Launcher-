name: Build TCL Launcher APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Package Project Files
      run: |
        mkdir -p output_apk
        zip -r output_apk/tcl-custom-launcher.zip .

    - name: Upload Project Package
      uses: actions/upload-artifact@v3
      with:
        name: tcl-custom-launcher-apk
        path: output_apk/
