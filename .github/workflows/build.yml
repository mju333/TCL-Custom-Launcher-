name: Build TCL Launcher APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Package App Files
      run: |
        mkdir -p output
        zip -r output/TCL-Launcher.zip .

    - name: Upload APK/Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TCL-Launcher-Package
        path: output/TCL-Launcher.zip
